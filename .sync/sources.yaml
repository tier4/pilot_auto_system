# Declarative description of every mirror this repository publishes.
#
# This file is the single source of truth. tools/mirror.py derives the
# git-filter-repo invocation, the commit-message rewriting, the per-source
# mirror branches and the combined branches from it; nothing about the mapping
# is hard-coded in the workflow.
#
# The paths below reproduce what the previous mirror-*.yaml workflows filtered,
# so this change makes the pipeline configuration-driven without moving any
# package between repositories.
#
# Determinism contract
# --------------------
# Per-source mirrors are pure functions of (upstream commit, this file):
#
#   git-filter-repo rewrites each upstream history. Same input plus same
#   arguments always yields the same commit ids, so those branches publish as
#   fast-forwards. A failed push means reproducibility was lost.

version: 1

sources:
  autoware_universe:
    upstream: https://github.com/autowarefoundation/autoware_universe.git
    ref: main
    # New tip: path filter differs from the historical awf-latest tip (which
    # still contains default ADAPI packages), so this cannot fast-forward
    # awf-latest and is published under a new name instead.
    mirror_branch: awf-latest-no-adapi
    paths:
      # Keep system/ except packages that live under autoware_api instead:
      #   autoware_default_adapi_universe
      #   autoware_default_adapi_helpers/autoware_adapi_visualizers
      #   autoware_default_adapi_helpers/autoware_automatic_pose_initializer
      # (the helpers directory only contains those two packages today.)
      - regex: '^system/(?!autoware_default_adapi_universe(?:/|$)|autoware_default_adapi_helpers(?:/|$)).*'
      - path: .github/
      - path: docs/
      - regex: '^[^/]*$' # root-level files (LICENSE, NOTICE, ...)
    message_rules:
      - pattern: '#(\d+)'
        replacement: autowarefoundation/autoware_universe#\1

  tier4_universe_e2e:
    upstream: https://github.com/tier4/autoware_universe.git
    ref: feat/v0.64/e2e
    mirror_branch: feat/v0.64/e2e
    paths:
      - path: system/
      - path: .github/
      - path: docs/
      - regex: '^[^/]*$' # root-level files (LICENSE, NOTICE, ...)
    # Commits authored before the fork point still refer to upstream pull
    # requests; later ones refer to the TIER IV fork.
    message_rules:
      - until: 2026-02-21T00:00:00Z
        pattern: '#(\d+)'
        replacement: autowarefoundation/autoware_universe#\1
      - since: 2026-02-21T00:00:00Z
        pattern: (?<!autowarefoundation)(?<!autowarefoundation/autoware_universe)#(\d+)
        replacement: tier4/autoware_universe#\1
